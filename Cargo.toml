[package]
name = "lynes"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lynes"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "3"
modular-bitfield = "0.13"
thiserror = "2"
wgpu = "30"
winit = "0.30"
pollster = "1"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
image = "0.25"

[dependencies.ratatui-image]
version = "11"
default-features = false
features = ["crossterm"]
